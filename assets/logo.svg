<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Brand Gradient: Primary Indigo to Secondary Cyan -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shape: Subtle Dark Hexagon -->
  <polygon points="50,5 90,28 90,72 50,95 10,72 10,28" fill="#18181b" stroke="url(#brandGrad)" stroke-width="2" opacity="0.8" />
  
  <!-- Sleek Geometric Double-Chevron (The Zenith Symbol) -->
  <!-- Upper Chevron -->
  <path d="M 30,52 L 50,32 L 70,52" fill="none" stroke="url(#brandGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Lower Chevron -->
  <path d="M 35,68 L 50,53 L 65,68" fill="none" stroke="url(#brandGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  
  <!-- Glowing Center Core Dot -->
  <circle cx="50" cy="18" r="4" fill="#06b6d4" filter="url(#glow)" />
</svg>
